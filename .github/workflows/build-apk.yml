name: Build CourseHub Udemy APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.java'
      - '**.xml'
      - '**.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner already includes the Android SDK.
      # Avoid android-actions/setup-android here because its sdkmanager
      # update check can fail before the build starts.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms/android-35" || {
            echo "Android SDK platform 35 is not installed on this runner."
            ls -la "${ANDROID_HOME}/platforms" || true
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CourseHubUdemy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

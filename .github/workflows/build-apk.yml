
name: Build CourseHub Udemy APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "ERROR: Android SDK Platform 35 is missing."
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CourseHubUdemy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
